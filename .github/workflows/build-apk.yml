name: Compilar APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar el SDK de Android
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma y herramientas
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Permitir ejecutar gradlew
        run: chmod +x ./gradlew

      - name: Compilar el APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Preparar el archivo final
        run: |
          mkdir -p salida
          cp app/build/outputs/apk/debug/app-debug.apk salida/Habitos.apk
          ls -lh salida

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Habitos-APK
          path: salida/Habitos.apk

      # La descarga directa NO se borra nunca y se vuelve a crear.
      #
      # Antes esto hacia "gh release delete --cleanup-tag" y despues "create".
      # El problema es que entre las dos ordenes el enlace no existe, y si la
      # segunda falla -- borrar una etiqueta y volver a crearla con el mismo
      # nombre tarda un rato impredecible en propagarse -- te quedas sin
      # descarga y con la etiqueta huerfana, sin release detras.
      #
      # Ahora: se mueve la etiqueta al commit recien compilado, se crea la
      # release solo si no existe, y el APK se sustituye con --clobber. El
      # enlace apunta siempre al mismo sitio y nunca deja de funcionar.
      - name: Publicar descarga directa
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag -f apk
          git push -f origin refs/tags/apk

          gh release view apk > /dev/null 2>&1 || gh release create apk \
            --title "Habitos - ultima version" \
            --notes "APK listo para instalar. Abre esta pagina desde tu Android y toca Habitos.apk."

          gh release upload apk salida/Habitos.apk --clobber

      - name: Enlace de descarga
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "### APK listo" >> $GITHUB_STEP_SUMMARY
          echo "Descargalo desde tu Android aqui:" >> $GITHUB_STEP_SUMMARY
          gh release view apk --json url -q .url >> $GITHUB_STEP_SUMMARY
